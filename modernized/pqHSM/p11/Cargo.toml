[package]
name = "pqhsm-p11"
description = "pqHSM PKCS#11 API layer (replaces src/fhsm_pkcs11.c, PHASE4_PLAN.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[features]
# The C ABI. Off for `cargo test`, on in the module: the tables name the exported C_* entry
# points, which pqhsm-module defines (module/src/lib.rs).
ffi = []
# The module's build settings (pqhsm-module forwards them): fhsm_build_fips_strict 0, and
# AUDIT_MANDATORY false.
all-mechanisms = []
audit-optional = []

[dependencies]
libc.workspace = true
pqhsm-core = { path = "../core" }
# The digest primitives (slice 3); the module links the crate with its C ABI already.
pqhsm-crypto = { path = "../crypto" }
