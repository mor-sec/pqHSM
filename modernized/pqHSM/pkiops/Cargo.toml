[package]
name = "pqhsm-pkiops"
description = "pqHSM PKI operations: the library under the PKI tools (replaces tools/pkiops.c and tools/p11_util.h, Phase 5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# staticlib: linked into the C tools and test_pkiops* by hybrid.mk, with pqhsm-pki's C ABI
# (their links took the composite and revocation code from pqhsm-module). rlib: pqhsm-cli.
crate-type = ["staticlib", "rlib"]

[dependencies]
libc.workspace = true
openssl.workspace = true
openssl-sys.workspace = true
zeroize.workspace = true
# Its C ABI: the request and certificate builders, and the composite and revocation code the
# C tools' links took from pqhsm-module before.
pqhsm-pki = { path = "../pki", features = ["ffi"] }

[dev-dependencies]
tempfile.workspace = true
