[package]
name = "pqhsm-module"
description = "The one Rust staticlib linked into libfreehsm.so by hybrid.mk (PILOT_PLAYBOOK.md §2.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Path dependencies on the other crates; never published (cargo deny: allow-wildcard-paths).
publish = false

[lib]
crate-type = ["staticlib"]

[features]
# The test_tpm build only, into its own --target-dir (PHASE2_PLAN.md §3(d), review H6).
tpm-test-hooks = ["pqhsm-token/tpm-test-hooks"]
# The self-test bypass variables (DIV-034): the hybrid harness only, never a release build.
dev-bypass = ["pqhsm-crypto/dev-bypass", "pqhsm-selftest/dev-bypass"]

[dependencies]
pqhsm-audit = { path = "../audit", features = ["ffi"] }
pqhsm-token = { path = "../token", features = ["ffi"] }
pqhsm-pki = { path = "../pki", features = ["ffi"] }
pqhsm-crypto = { path = "../crypto", features = ["ffi"] }
pqhsm-selftest = { path = "../selftest", features = ["ffi"] }
