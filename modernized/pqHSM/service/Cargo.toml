[package]
name = "pqhsm-service"
description = "pqHSM's HTTP service (replaces service/fhsm_service.c, Phase 6): the module and the service in one staticlib, linked by hybrid.mk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# staticlib: the service links the module statically, as C's does (Makefile `service/fhsm-service`),
# so the module (as an rlib) and the service share one copy of std. hybrid.mk adds the C shims.
crate-type = ["staticlib"]

[features]
# As pqhsm-module's (DIV-034): the hybrid harness only, never a release build.
dev-bypass = ["pqhsm-module/dev-bypass"]

[dependencies]
pqhsm-module = { path = "../module" }
pqhsm-pkiops = { path = "../pkiops" }
pqhsm-pki = { path = "../pki", features = ["ffi"] }
libc.workspace = true
zeroize.workspace = true
